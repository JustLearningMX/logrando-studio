name: Deploy to GitHub Pages

# Astro build, then three gates before anything reaches Pages. The gates exist
# because /privacy/, /terms/ and /tiktok/callback/ are URLs registered inside
# the TikTok and Google developer portals: once a build step sits between the
# source and those pages, a green build is no longer proof they still work.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-applied deploy
# of the OAuth callback page would break an authorization in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Verify the pages the portals depend on
        run: npm run verify

      - name: Check internal links
        run: bash scripts/check-links.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
